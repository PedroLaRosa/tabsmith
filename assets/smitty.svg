<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="smitty-title smitty-desc">
  <title id="smitty-title">Smitty</title>
  <desc id="smitty-desc">Smitty, the tabsmith mascot, named for the alto saxophonist Tab Smith: a cute orange tabby cat in a bow tie, playing an alto saxophone.</desc>
  <defs>
    <style>
      .line { stroke: #3b2618; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
      .fur { fill: #f4a24c; }
      .stripe { fill: none; stroke: #c96a1f; stroke-width: 10; stroke-linecap: round; }
      .cream { fill: #fff3df; }
      .pink { fill: #f59a9a; }
      .brass { fill: #f2c14e; }
      .tube-outline { fill: none; stroke: #3b2618; stroke-linecap: round; }
      .tube { fill: none; stroke: #f2c14e; stroke-linecap: round; }
      .note { fill: #ffd34d; stroke: #3b2618; stroke-width: 4; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- tail -->
  <path class="fur line" d="M182 430 C102 440 72 390 92 340 C100 318 80 300 64 312 C42 330 42 400 82 440 C112 470 162 468 192 455 Z"/>
  <path class="stripe" d="M76 330 L56 326 M72 372 L50 372 M86 412 L66 424"/>

  <!-- body and belly -->
  <ellipse class="fur line" cx="256" cy="388" rx="108" ry="88"/>
  <ellipse class="cream" cx="252" cy="402" rx="62" ry="56"/>

  <!-- feet -->
  <ellipse class="cream line" cx="206" cy="466" rx="34" ry="20"/>
  <ellipse class="cream line" cx="306" cy="466" rx="34" ry="20"/>
  <path fill="none" stroke="#3b2618" stroke-width="5" stroke-linecap="round" d="M196 462 L196 474 M216 462 L216 474 M296 462 L296 474 M316 462 L316 474"/>

  <!-- ears -->
  <path class="fur line" d="M118 168 Q112 70 140 52 Q168 62 226 112 Z"/>
  <path class="pink" d="M134 140 Q134 92 146 80 Q162 92 192 116 Z"/>
  <path class="fur line" d="M394 168 Q400 70 372 52 Q344 62 286 112 Z"/>
  <path class="pink" d="M378 140 Q378 92 366 80 Q350 92 320 116 Z"/>

  <!-- head -->
  <ellipse class="fur line" cx="256" cy="212" rx="152" ry="120"/>

  <!-- tabby "M" on the forehead -->
  <path class="stripe" d="M220 146 L232 112 L256 138 L280 112 L292 146"/>
  <!-- cheek stripes -->
  <path class="stripe" d="M106 196 L138 202 M110 230 L140 230 M406 196 L374 202 M402 230 L372 230"/>

  <!-- muzzle -->
  <ellipse class="cream" cx="256" cy="262" rx="64" ry="42"/>

  <!-- eyes -->
  <ellipse fill="#3b2618" cx="194" cy="212" rx="24" ry="28"/>
  <ellipse fill="#3b2618" cx="318" cy="212" rx="24" ry="28"/>
  <circle fill="#ffffff" cx="202" cy="200" r="9"/>
  <circle fill="#ffffff" cx="326" cy="200" r="9"/>
  <circle fill="#ffffff" cx="186" cy="224" r="4"/>
  <circle fill="#ffffff" cx="310" cy="224" r="4"/>

  <!-- blush -->
  <ellipse class="pink" cx="160" cy="258" rx="22" ry="12" opacity="0.7"/>
  <ellipse class="pink" cx="352" cy="258" rx="22" ry="12" opacity="0.7"/>

  <!-- nose and mouth -->
  <path class="pink" stroke="#3b2618" stroke-width="5" stroke-linejoin="round" d="M242 242 L270 242 L256 258 Z"/>
  <path fill="none" stroke="#3b2618" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" d="M256 258 L256 268 Q246 282 232 272 M256 268 Q266 282 280 272"/>

  <!-- whiskers -->
  <path fill="none" stroke="#3b2618" stroke-width="4" stroke-linecap="round" d="M196 266 L128 258 M198 280 L132 288 M316 266 L384 258 M314 280 L380 288"/>

  <!-- bow tie -->
  <path class="line" fill="#d6455d" d="M256 340 L214 320 Q206 340 214 360 Z M256 340 L298 320 Q306 340 298 360 Z"/>
  <rect class="line" fill="#b8344b" x="244" y="328" width="24" height="24" rx="7"/>

  <!-- alto saxophone: mouthpiece under the smile, neck, body, bend and upturned bell -->
  <path class="tube-outline" stroke-width="20" d="M266 292 Q284 302 300 318"/>
  <path class="tube" stroke-width="10" d="M266 292 Q284 302 300 318"/>
  <path class="tube-outline" stroke-width="40" d="M300 318 L372 430 Q392 466 426 444"/>
  <path class="tube" stroke-width="26" d="M300 318 L372 430 Q392 466 426 444"/>
  <path fill="none" stroke="#3b2618" stroke-width="12" stroke-linecap="round" d="M258 287 L268 293"/>
  <path class="brass line" d="M410 434 L415 358 L489 390 L438 446 Z"/>
  <ellipse fill="#8a5a12" stroke="#3b2618" stroke-width="6" cx="452" cy="374" rx="40" ry="11" transform="rotate(23 452 374)"/>
  <g fill="#fff3df" stroke="#3b2618" stroke-width="4">
    <circle cx="307" cy="330" r="7"/>
    <circle cx="341" cy="383" r="7"/>
  </g>

  <!-- paws on the keys -->
  <ellipse class="fur line" cx="322" cy="354" rx="26" ry="24"/>
  <path fill="none" stroke="#3b2618" stroke-width="5" stroke-linecap="round" d="M314 342 Q322 348 318 360 M328 340 Q336 346 332 358"/>
  <ellipse class="fur line" cx="362" cy="412" rx="26" ry="24"/>
  <path fill="none" stroke="#3b2618" stroke-width="5" stroke-linecap="round" d="M354 400 Q362 406 358 418 M368 398 Q376 404 372 416"/>

  <!-- music notes from the bell: gold stems over dark edges, so they show on light and dark backgrounds -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path stroke="#3b2618" stroke-width="10" d="M446 300 L446 256 L470 248 L470 290 M446 266 L470 258 M440 148 L440 110 Q452 118 460 132 M489 208 L489 176 Q499 182 505 194"/>
    <path stroke="#ffd34d" stroke-width="4" d="M446 300 L446 256 L470 248 L470 290 M446 266 L470 258 M440 148 L440 110 Q452 118 460 132 M489 208 L489 176 Q499 182 505 194"/>
  </g>
  <g class="note">
    <ellipse cx="438" cy="302" rx="11" ry="8" transform="rotate(-20 438 302)"/>
    <ellipse cx="462" cy="292" rx="11" ry="8" transform="rotate(-20 462 292)"/>
    <ellipse cx="432" cy="150" rx="10" ry="7" transform="rotate(-20 432 150)"/>
    <ellipse cx="482" cy="210" rx="9" ry="6" transform="rotate(-20 482 210)"/>
  </g>
</svg>
