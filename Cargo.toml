[package]
name = "tabsmith"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "IDE-style autocomplete for your terminal: dropdown menu + inline ghost text, driven by Fig completion specs"
license = "MIT OR Apache-2.0"

[features]
default = ["embed-specs"]
embed-specs = []

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
alacritty_terminal = "0.26"
crossterm = "0.29"
rquickjs = "0.14"
zstd = "0.13"
tar = "0.4"
ureq = { version = "3", features = ["json"] }
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_Storage_FileSystem"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
