name: ci

on:
  # Branches only: a pushed v* tag runs this through release.yml instead of twice.
  push:
    branches: ['**']
  pull_request:
  # release.yml runs this as the gate before it builds the release binaries.
  workflow_call:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Pinned, and the toolchain from the runners' rustup rather than an action: this job also runs inside the release
      # workflow, where every action shares the run that publishes signed binaries.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install the Rust toolchain
        shell: bash
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Install shells for the integration syntax tests
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh fish
      # /bin/bash is 3.2, which tabsmith does not support (SPEC D15); Homebrew's bin comes first on PATH.
      - name: Install a supported bash
        if: runner.os == 'macOS'
        run: brew install bash
      # bash on PATH is otherwise System32's WSL launcher, which has no distribution to run.
      - name: Put Git Bash first on PATH
        if: runner.os == 'Windows'
        shell: bash
        run: echo 'C:\Program Files\Git\bin' >> "$GITHUB_PATH"
      - name: Check the POSIX installer
        if: runner.os == 'Linux'
        run: sh -n scripts/install.sh && shellcheck --shell=sh scripts/install.sh
      # The installer runs under Windows PowerShell 5.1 (install.cmd, `irm | iex`) and PowerShell 7.
      - name: Parse the PowerShell installer with Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\scripts\install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error "$($_.Extent.StartLineNumber): $($_.Message)" }; exit 1 }
      - name: Parse the PowerShell installer with PowerShell 7
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\scripts\install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error "$($_.Extent.StartLineNumber): $($_.Message)" }; exit 1 }
      - run: cargo build --locked
      - run: cargo test --locked
      - name: Load every bundled spec module
        run: cargo test --locked --release -- --ignored all_bundle_modules
